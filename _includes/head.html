<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"><meta property="og:site_name" content="{{ site.title }}"><meta property="og:title" content="{{ page.title | default: site.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}">{% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
<meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}"><meta name="twitter:title" content="{{ page.title | default: site.title | escape }}"><meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">{% if page.image %}<meta name="twitter:image" content="{{ page.image | absolute_url }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
