{% assign social_image = page.image | default: site.default_social_image %}<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title }}"><link rel="icon" type="image/png" href="{{ '/assets/img/logo.png' | relative_url }}"><meta property="og:locale" content="fr_FR"><meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"><meta property="og:site_name" content="{{ site.title }}"><meta property="og:title" content="{{ page.title | default: site.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ social_image | absolute_url }}"><meta property="og:image:alt" content="{{ page.title | default: site.title | escape }}">{% if page.layout == 'post' %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{ page.title | default: site.title | escape }}"><meta name="twitter:description" content="{{ page.description | default: site.description | escape }}"><meta name="twitter:image" content="{{ social_image | absolute_url }}"><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
