---
layout: default
---
<article class="article-sheet">
  <div class="article-kicker">Fiche pratique <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></div>
  <a class="source-stamp" href="{{ site.repository_url }}/blob/{{ site.branch }}/{{ page.path }}" target="_blank" rel="noopener">MD source</a>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}
  <div class="prose">{{ content }}</div>
</article>
